<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeatChat++</title>
  <title></title>
  <link rel="stylesheet" href="/css/style.css" />
  <!-- Socket.io client -->
  <script src="/socket.io/socket.io.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <!--<link>-->
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ==================== AUTH SCREEN ==================== -->
  <div id="auth-screen" class="screen active">
    <div class="auth-container">
      <div class="auth-brand">
        <div class="brand-icon">⚡</div>
        <h1>NeatChat<span class="brand-plus">++</span></h1>
        <p class="brand-tagline">AI-Powered · Real-Time · Optimized</p>
      </div>

      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="tab-btn active" data-tab="login">Login</button>
        <button class="tab-btn" data-tab="signup">Sign Up</button>
      </div>

      <!-- Login Form -->
      <div id="login-form" class="auth-form active">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="login-username" placeholder="Enter your username" autocomplete="off"/>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="Enter your password"/>
        </div>
        <button class="btn-primary" id="login-btn">Login →</button>
        <div id="login-error" class="error-msg"></div>
      </div>

      <!-- Signup Form -->
      <div id="signup-form" class="auth-form">
        <div class="form-group">
          <label>Choose Username</label>
          <input type="text" id="signup-username" placeholder="Pick a cool username" autocomplete="off"/>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signup-password" placeholder="Min 4 characters"/>
        </div>
        <button class="btn-primary" id="signup-btn">Create Account →</button>
        <div id="signup-error" class="error-msg"></div>
      </div>

      <!-- DS Info -->
      <div class="ds-badges">
        <span class="badge">Trie Search</span>
        <span class="badge">LRU Cache</span>
        <span class="badge">Heap Priority</span>
        <span class="badge">AI Filter</span>
      </div>
    </div>
  </div>

  <!-- ==================== CHAT SCREEN ==================== -->
  <div id="chat-screen" class="screen">
    <!-- Sidebar -->
    <aside class="sidebar">
      <!-- User Info -->
      <div class="sidebar-header">
        <div class="user-info">
          <img id="my-avatar" class="avatar" src="" alt="Avatar"/>
          <div>
            <div id="my-username" class="username">User</div>
            <div class="status-dot online">● Online</div>
          </div>
        </div>
        <button class="icon-btn" id="logout-btn" title="Logout">⏻</button>
      </div>

      <!-- Search Bar -->
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="🔍 Search messages (Trie)..." />
      </div>

      <!-- Search Results -->
      <div id="search-results" class="search-results hidden"></div>

      <!-- Contacts / Recent Chats -->
      <div class="sidebar-section">
        <div class="section-label">CONTACTS</div>
        <div id="contact-list" class="contact-list">
          <div class="loading-text">Loading contacts...</div>
        </div>
      </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="chat-area">
      <!-- Default: No chat selected -->
      <div id="no-chat" class="no-chat-placeholder">
        <div class="placeholder-icon">💬</div>
        <h2>Select a contact to start chatting</h2>
        <p>Messages are powered by Trie search, LRU cache & AI filtering</p>
      </div>

      <!-- Active Chat -->
      <div id="active-chat" class="hidden">
        <!-- Chat Header -->
        <div class="chat-header">
          <div class="chat-header-user">
            <img id="chat-avatar" class="avatar" src="" alt="Avatar"/>
            <div>
              <div id="chat-username" class="username"></div>
              <div id="chat-status" class="chat-status">Offline</div>
            </div>
          </div>
          <div class="chat-header-actions">
            <div class="ds-indicator" title="Using LRU Cache for this conversation">
              <span class="ds-tag">📦 LRU</span>
            </div>
          </div>
        </div>

        <!-- Typing Indicator -->
        <div id="typing-indicator" class="typing-indicator hidden">
          <span class="typing-dots"><span></span><span></span><span></span></span>
          <span id="typing-name">Someone</span> is typing...
        </div>

        <!-- Messages -->
        <div id="messages-container" class="messages-container"></div>

        <!-- Smart Replies -->
        <div id="smart-replies" class="smart-replies hidden">
          <span class="sr-label">🤖 Smart Replies:</span>
          <div id="smart-reply-btns" class="sr-buttons"></div>
        </div>

        <!-- Message Input -->
        <div class="message-input-area">
          <div class="input-row">
            <textarea
              id="message-input"
              placeholder="Type a message..."
              rows="1"
            ></textarea>
            <button class="btn-send" id="send-btn">➤</button>
          </div>
          <div id="ai-warning" class="ai-warning hidden">
            <span>⚠️</span> <span id="warning-text"></span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- ==================== NOTIFICATION TOAST ==================== -->
  <div id="toast" class="toast hidden"></div>

  <script src="/js/app.js"></script>
</body>
</html>
